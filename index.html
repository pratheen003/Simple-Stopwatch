<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stop Watch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stopwatch-container">
    <div class="display" id="display">00:00:00:00</div>
    <div class="controls">
      <button class="btn-start" id="startBtn">Start</button> <h1>|</h1>
      <button class="btn-stop" id="stopBtn" disabled>Stop</button> <h1>|</h1>
      <button class="btn-reset" id="resetBtn" disabled>Reset</button> <h1>|</h1>
      <button class="btn-lap" id="lapBtn" disabled>Lap</button>
    </div>
    <div class="laps">
      <h3>Laps</h3>
      <ul id="lapsList"></ul>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
